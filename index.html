<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>EA Monitor</title>
<style>
  :root{
    --bg:#000; --card:#111417; --line:#23282e; --text:#f4f6f8; --dim:#9aa4af;
    --up:#2ee66b; --down:#ff4fa3; --cyan:#29d3ff; --warn:#ffcc33;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{padding:16px 16px 8px}
  h1{margin:0;font-size:20px;letter-spacing:.3px}
  h1 span{color:var(--cyan)}
  #meta{color:var(--dim);font-size:12.5px;margin-top:3px}
  #relist{margin-top:8px;background:transparent;color:var(--cyan);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12.5px;cursor:pointer}
  main{padding:8px 12px 40px;max-width:1100px;margin:0 auto}
  .up{color:var(--up)} .down{color:var(--down)} .warn{color:var(--warn)} .dim{color:var(--dim)}
  .k{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  .v{font-weight:700;font-variant-numeric:tabular-nums;word-break:break-word}

  /* GENERAL */
  .general{background:var(--card);border:1px solid var(--cyan);border-radius:12px;padding:14px;margin-bottom:14px}
  .general h2{margin:0 0 2px;font-size:13px;color:var(--cyan);letter-spacing:.8px}
  .general .sub{color:var(--dim);font-size:12.5px}
  .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .g3 .v{font-size:19px}
  .other{margin-top:10px;font-size:12.5px;color:var(--dim)}

  /* LIST */
  .listhead{color:var(--dim);font-size:12px;margin:0 2px 6px}
  details.acc{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
  details.acc.stale{border-color:var(--warn)}
  details.acc[open]{border-color:#3a424b}
  details.acc>summary{list-style:none;cursor:pointer;padding:11px 12px;display:grid;gap:6px 12px;
    grid-template-columns:1fr auto;grid-template-areas:"id caret" "nums nums";align-items:center}
  details.acc>summary::-webkit-details-marker{display:none}
  .id{grid-area:id;min-width:0}
  .name{font-size:15.5px;font-weight:700;word-break:break-word}
  .broker{color:var(--dim);font-size:12px;letter-spacing:.4px;word-break:break-word}
  .badges{display:inline-flex;gap:5px;flex-wrap:wrap;margin-left:6px;vertical-align:middle}
  .badge{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--cyan);white-space:nowrap}
  .badge.type{color:#000;background:var(--cyan);border-color:var(--cyan)}
  .badge.demo{color:#000;background:var(--warn);border-color:var(--warn)}
  .caret{grid-area:caret;color:var(--dim);font-size:13px;transition:transform .15s}
  details.acc[open] .caret{transform:rotate(90deg)}
  .nums{grid-area:nums;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .nums .v{font-size:14.5px}
  .body{border-top:1px solid var(--line);padding:10px 12px 12px}
  table.kv{width:100%;border-collapse:collapse;font-size:13.5px}
  table.kv td{padding:4px 0;border-bottom:1px solid #191d22;font-variant-numeric:tabular-nums}
  table.kv td:last-child{text-align:right;font-weight:600}
  .ptitle{margin:12px 0 4px;font-size:13px;color:var(--cyan)}
  .scroll{overflow-x:auto}
  table.pos{width:100%;border-collapse:collapse;font-size:12.5px;min-width:440px}
  table.pos th,table.pos td{padding:4px 6px;border-bottom:1px solid #191d22;text-align:right;white-space:nowrap}
  table.pos th:first-child,table.pos td:first-child{text-align:left}
  table.pos th{color:var(--dim);font-weight:500}
  .foot{color:var(--dim);font-size:12px;margin-top:10px}
  #msg{padding:12px;color:var(--warn);font-size:14px}

  @media (min-width:760px){
    details.acc>summary{grid-template-columns:minmax(0,1.3fr) minmax(0,1.5fr) auto;grid-template-areas:"id nums caret"}
    .nums .v{font-size:15.5px;text-align:right}
    .nums .k{text-align:right}
    .g3 .v{font-size:24px}
  }
</style>
</head>
<body>
<header>
  <h1>EA <span>Monitor</span></h1>
  <div id="meta">Memuat...</div>
  <button id="relist" type="button">Perbarui daftar akun</button>
</header>
<main>
  <div id="msg" hidden></div>
  <section class="general" id="general" hidden></section>
  <div class="listhead" id="listhead"></div>
  <div id="list"></div>
</main>

<script>
// Kosongkan user/repo untuk dideteksi otomatis dari alamat USERNAME.github.io/REPO/
// files: daftar nama file manual (cadangan), mis. ["hfm-cent.json","xm-micro.json"]
var CFG = { user: "", repo: "", branch: "data", refreshSec: 120, staleMin: 15, listTtlMin: 60, files: [] };
// Pembagi ke USD untuk mata uang sen. Mata uang lain (mis. IDR) tidak dijumlahkan ke TOTAL USD.
var TO_USD = { "USD": 1, "USC": 100 };
var OPEN = {};

function target(){
  var q = new URLSearchParams(location.search);
  var u = q.get("user") || CFG.user, r = q.get("repo") || CFG.repo;
  var host = location.hostname;
  if(!u && /\.github\.io$/i.test(host)) u = host.split(".")[0];
  if(!r){
    var seg = location.pathname.split("/").filter(Boolean);
    r = (seg.length && !/\.html?$/i.test(seg[0])) ? seg[0] : host;
  }
  return { u: u, r: r, b: q.get("branch") || CFG.branch };
}
function el(tag, cls, text){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text !== undefined && text !== null) e.textContent = text;
  return e;
}
function num(x, d){
  var v = Number(x);
  if(!isFinite(v)) return "-";
  d = (d === undefined) ? 2 : d;
  return v.toLocaleString("id-ID", { minimumFractionDigits: d, maximumFractionDigits: d });
}
function sign(x){ var v = Number(x); return v > 0 ? "up" : (v < 0 ? "down" : ""); }
function ago(sec){
  if(!isFinite(sec) || sec < 0) sec = 0;
  if(sec < 90) return Math.round(sec) + " detik lalu";
  if(sec < 5400) return Math.round(sec / 60) + " menit lalu";
  if(sec < 172800) return Math.round(sec / 3600) + " jam lalu";
  return Math.round(sec / 86400) + " hari lalu";
}
function dateStr(unix){
  if(!unix) return "-";
  return new Date(unix * 1000).toLocaleString("id-ID", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
}
function store(key, val){
  try{
    if(val === undefined) return JSON.parse(localStorage.getItem(key) || "null");
    localStorage.setItem(key, JSON.stringify(val));
  }catch(e){}
  return null;
}
function isDemo(a){
  if(a.demo === true || a.demo === false) return a.demo;
  return /demo|contest/i.test(String(a.server || "") + " " + String(a.label || ""));   // data dari EA versi lama
}
function ddNow(fl, eq){            // DD sekarang = floating minus dibagi equity
  fl = Number(fl); eq = Number(eq);
  if(!(fl < 0) || !(eq > 0)) return 0;
  return -fl / eq * 100;
}
function cur(a){ return String(a.currency || "").toUpperCase(); }

function okName(n){ return /\.json$/i.test(n) && n.charAt(0) !== "_"; }
function union(){
  var seen = {}, out = [];
  for(var i = 0; i < arguments.length; i++){
    (arguments[i] || []).forEach(function(n){ n = String(n).trim(); if(n && !/\.json$/i.test(n)) n += ".json"; if(okName(n) && !seen[n]){ seen[n] = 1; out.push(n); } });
  }
  return out;
}
async function listFiles(t, force){
  var key = "mjmon:" + t.u + "/" + t.r;
  var c = store(key);
  if(Array.isArray(c)) c = { names: c, at: 0 };          // format cache versi lama
  if(!c || !c.names) c = { names: [], at: 0 };
  var q = new URLSearchParams(location.search).get("files");
  var manual = q ? q.split(",") : CFG.files;

  // 1) _index.json di branch data (dibuat otomatis oleh GitHub Actions). Tidak terkena batas 60 permintaan/jam.
  var idx = [];
  try{
    var r1 = await fetch("https://raw.githubusercontent.com/" + t.u + "/" + t.r + "/" + t.b + "/_index.json?t=" + Date.now(), { cache: "no-store" });
    if(r1.ok){ var a1 = await r1.json(); if(Array.isArray(a1)) idx = a1; }
  }catch(e){}
  if(idx.length){
    var n1 = union(idx, c.names, manual);
    store(key, { names: n1, at: c.at });
    return { names: n1, note: "" };
  }

  // 2) Cadangan: tanya daftar file ke GitHub API, paling sering sekali per jam.
  if(!force && c.names.length && Date.now() - c.at < CFG.listTtlMin * 60000) return { names: union(c.names, manual), note: "" };
  try{
    var res = await fetch("https://api.github.com/repos/" + t.u + "/" + t.r + "/contents?ref=" + encodeURIComponent(t.b),
                          { headers: { "Accept": "application/vnd.github+json" } });
    if(!res.ok) throw new Error("HTTP " + res.status);
    var arr = await res.json();
    var names = union(arr.filter(function(f){ return f.type === "file"; }).map(function(f){ return f.name; }), manual);
    store(key, { names: names, at: Date.now() });
    return { names: names, note: "" };
  }catch(e){
    var have = union(c.names, manual);
    if(have.length) return { names: have, note: force ? "Daftar akun belum bisa diperbarui (" + e.message + "). Data akun tetap dimuat. Akun baru muncul setelah daftar otomatis (_index.json) diperbarui." : "" };
    throw e;
  }
}
async function getOne(t, name){
  try{
    var url = "https://raw.githubusercontent.com/" + t.u + "/" + t.r + "/" + t.b + "/" + encodeURIComponent(name) + "?t=" + Date.now();
    var res = await fetch(url, { cache: "no-store" });
    if(!res.ok) return null;
    return await res.json();
  }catch(e){ return null; }
}

function kvRow(tb, k, v, cls){
  var tr = el("tr");
  tr.appendChild(el("td", "dim", k));
  tr.appendChild(el("td", cls || "", v));
  tb.appendChild(tr);
}
function cell(k, v, cls){
  var d = el("div");
  d.appendChild(el("div", "k", k));
  d.appendChild(el("div", "v " + (cls || ""), v));
  return d;
}

function general(list, nowSec){
  var box = document.getElementById("general");
  box.textContent = "";
  box.hidden = false;
  var real = list.filter(function(a){ return !isDemo(a); });
  var demo = list.length - real.length;
  var bal = 0, eq = 0, fl = 0, counted = 0, other = {};
  real.forEach(function(a){
    var div = TO_USD[cur(a)];
    if(div){
      bal += (Number(a.balance) || 0) / div; eq += (Number(a.equity) || 0) / div; fl += (Number(a.floating) || 0) / div; counted++;
    }else{
      var c = cur(a) || "?";
      if(!other[c]) other[c] = { n: 0, bal: 0, eq: 0, fl: 0 };
      other[c].n++; other[c].bal += Number(a.balance) || 0; other[c].eq += Number(a.equity) || 0; other[c].fl += Number(a.floating) || 0;
    }
  });
  var stale = list.filter(function(a){ return nowSec - Number(a.updated || 0) > CFG.staleMin * 60; }).length;
  box.appendChild(el("h2", "", "GENERAL · TOTAL USD"));
  box.appendChild(el("div", "sub", counted + " akun real dijumlahkan · " + demo + " akun demo tidak dihitung" +
                                   (stale ? " · " + stale + " akun tidak ada kabar" : "")));
  var g = el("div", "g3");
  g.appendChild(cell("Balance", num(bal)));
  g.appendChild(cell("Equity", num(eq)));
  g.appendChild(cell("Floating", num(fl), sign(fl)));
  box.appendChild(g);
  box.appendChild(el("div", "other", "DD sekarang (floating ÷ equity): " + num(ddNow(fl, eq), 1) + "%"));
  Object.keys(other).sort().forEach(function(c){
    box.appendChild(el("div", "other", "Tidak dijumlahkan ke USD — " + c + " (" + other[c].n + " akun): balance " + num(other[c].bal) +
                                       " · equity " + num(other[c].eq) + " · floating " + num(other[c].fl)));
  });
}

function account(a, nowSec){
  var id = String(a.id || a.label || "");
  var age = nowSec - Number(a.updated || 0);
  var stale = age > CFG.staleMin * 60;
  var det = el("details", "acc" + (stale ? " stale" : ""));
  if(OPEN[id]) det.open = true;
  det.addEventListener("toggle", function(){ OPEN[id] = det.open; });

  // baris ringkas
  var sum = el("summary");
  var idb = el("div", "id");
  var nm = el("div", "name", a.label || id || "akun");
  var bd = el("span", "badges");
  if(a.type) bd.appendChild(el("span", "badge type", String(a.type).toUpperCase()));
  if(isDemo(a)) bd.appendChild(el("span", "badge demo", "DEMO"));
  bd.appendChild(el("span", "badge", (a.platform || "MT") + (cur(a) ? " · " + cur(a) : "")));
  nm.appendChild(bd);
  idb.appendChild(nm);
  idb.appendChild(el("div", "broker", String(a.broker || a.server || "").toUpperCase() + (stale ? "  ·  TIDAK ADA KABAR" : "")));
  var who = [a.name, a.login ? "#" + a.login : ""].filter(Boolean).join(" · ");
  if(who) idb.appendChild(el("div", "broker", who));
  sum.appendChild(idb);
  var nums = el("div", "nums");
  nums.appendChild(cell("Balance", num(a.balance)));
  nums.appendChild(cell("Equity", num(a.equity)));
  var ddp = ddNow(a.floating, a.equity);
  nums.appendChild(cell("Floating", num(a.floating) + (ddp > 0 ? "  (" + num(ddp, 1) + "%)" : ""), sign(a.floating)));
  sum.appendChild(nums);
  sum.appendChild(el("span", "caret", "▶"));
  det.appendChild(sum);

  // rincian
  var body = el("div", "body");
  var tb = el("table", "kv");
  kvRow(tb, "EA", (a.eas && a.eas.length) ? a.eas.join(", ") : "-", "warn");
  kvRow(tb, "DD sekarang (floating ÷ equity)", num(ddp, 1) + "%", ddp > 0 ? "down" : "");
  kvRow(tb, "DD maks (balance)", num(a.dd_bal) + "  (" + num(a.dd_bal_pct, 1) + "%)", Number(a.dd_bal) > 0 ? "down" : "");
  kvRow(tb, "DD maks (equity)", num(a.dd_eq) + "  (" + num(a.dd_eq_pct, 1) + "%)", Number(a.dd_eq) > 0 ? "down" : "");
  var hasPf = !(a.profit_factor === null || a.profit_factor === undefined);
  kvRow(tb, "Profit factor", hasPf ? num(a.profit_factor) : "-", hasPf ? (a.profit_factor >= 1 ? "up" : "down") : "");
  var wr = a.trades > 0 ? " · menang " + num(a.wins / a.trades * 100, 0) + "%" : "";
  kvRow(tb, "Trade tertutup", (a.trades || 0) + wr);
  kvRow(tb, "Profit bersih", num(a.net_profit), sign(a.net_profit));
  kvRow(tb, "Margin level", Number(a.margin) > 0 ? num(a.margin_level, 0) + "%" : "-");
  if(a.name) kvRow(tb, "Pemilik akun", a.name);
  if(a.login) kvRow(tb, "Nomor akun", String(a.login));
  if(a.server) kvRow(tb, "Server", a.server);
  body.appendChild(tb);

  var pos = a.positions || [];
  body.appendChild(el("div", "ptitle", "Posisi terbuka: " + pos.length + "  ·  Pending: " + (a.pending || 0)));
  if(pos.length){
    var wrap = el("div", "scroll");
    var t = el("table", "pos");
    var hr = el("tr");
    ["Simbol", "Tipe", "Lot", "Harga", "P/L", "Magic", "Komentar"].forEach(function(h){ hr.appendChild(el("th", "", h)); });
    t.appendChild(hr);
    pos.forEach(function(p){
      var tr = el("tr");
      tr.appendChild(el("td", "", p.s));
      tr.appendChild(el("td", p.t === "buy" ? "up" : "down", String(p.t || "").toUpperCase()));
      tr.appendChild(el("td", "", num(p.v)));
      tr.appendChild(el("td", "", String(p.p)));
      tr.appendChild(el("td", sign(p.pl), num(p.pl)));
      tr.appendChild(el("td", "dim", String(p.m)));
      tr.appendChild(el("td", "dim", p.c || ""));
      t.appendChild(tr);
    });
    wrap.appendChild(t);
    body.appendChild(wrap);
  }
  var foot = el("div", "foot");
  foot.appendChild(el("span", stale ? "warn" : "", "Update " + ago(age)));
  foot.appendChild(el("span", "", "  ·  DD dan profit factor dihitung sejak " + dateStr(a.since)));
  body.appendChild(foot);
  det.appendChild(body);
  return det;
}

async function load(force){
  var t = target();
  var msg = document.getElementById("msg"), meta = document.getElementById("meta");
  if(!t.u || !t.r){
    msg.hidden = false;
    msg.textContent = "Username/repository belum diketahui. Buka lewat alamat USERNAME.github.io/REPO/ atau tambahkan ?user=USERNAME&repo=REPO di alamat.";
    return;
  }
  try{
    var lf = await listFiles(t, force === true);
    var data = (await Promise.all(lf.names.map(function(n){ return getOne(t, n); }))).filter(Boolean);
    data.sort(function(a, b){
      var d = (isDemo(a) ? 1 : 0) - (isDemo(b) ? 1 : 0);
      return d !== 0 ? d : String(a.label || "").localeCompare(String(b.label || ""));
    });
    var nowSec = Date.now() / 1000;
    var list = document.getElementById("list");
    list.textContent = "";
    data.forEach(function(a){ list.appendChild(account(a, nowSec)); });
    if(data.length) general(data, nowSec);
    document.getElementById("listhead").textContent = data.length ? "Daftar akun — ketuk satu baris untuk melihat rincian" : "";
    msg.hidden = data.length > 0 && !lf.note;
    msg.textContent = data.length ? lf.note : "Belum ada data. Pasang MJ_MONITOR di terminal dan tunggu kiriman pertama.";
    meta.textContent = data.length + " akun · dimuat " + new Date().toLocaleTimeString("id-ID") +
                       " · muat ulang tiap " + CFG.refreshSec + " detik";
  }catch(e){
    msg.hidden = false;
    msg.textContent = e.message === "HTTP 403" ? "GitHub sedang membatasi permintaan dari alamat internet ini (HTTP 403). Coba lagi dalam satu jam, atau buka dari jaringan lain." : "Gagal memuat daftar akun (" + e.message + "). Cek nama repository dan branch '" + t.b + "'.";
    meta.textContent = "Gagal memuat";
  }
}
load();
setInterval(function(){ load(false); }, CFG.refreshSec * 1000);
document.getElementById("relist").addEventListener("click", function(){ load(true); });
</script>
</body>
</html>
