<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>EA Monitor</title>
<style>
  :root{
    --bg:#000; --card:#111417; --line:#23282e; --text:#f4f6f8; --dim:#9aa4af;
    --up:#2ee66b; --down:#ff4fa3; --cyan:#29d3ff; --warn:#ffcc33;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{padding:18px 16px 10px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:20px;letter-spacing:.3px}
  h1 span{color:var(--cyan)}
  #meta{color:var(--dim);font-size:13px;margin-top:4px}
  main{padding:14px 12px 40px;max-width:1280px;margin:0 auto}
  .totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-bottom:14px}
  .tot{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .tot h3{margin:0 0 6px;font-size:13px;color:var(--cyan);font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .card.stale{border-color:var(--warn)}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .name{font-size:17px;font-weight:700;word-break:break-word}
  .badge{font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--cyan);white-space:nowrap}
  .sub{color:var(--dim);font-size:12.5px;margin-top:2px;word-break:break-word}
  .eas{margin-top:6px;font-size:13px}
  .eas b{color:var(--warn);font-weight:600}
  .big{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0 4px}
  .big div{background:#0a0c0e;border:1px solid var(--line);border-radius:8px;padding:8px}
  .k{color:var(--dim);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px}
  .v{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;word-break:break-word}
  table.kv{width:100%;border-collapse:collapse;margin-top:8px;font-size:13.5px}
  table.kv td{padding:4px 0;border-bottom:1px solid #191d22;font-variant-numeric:tabular-nums}
  table.kv td:last-child{text-align:right;font-weight:600}
  .up{color:var(--up)} .down{color:var(--down)} .warn{color:var(--warn)} .dim{color:var(--dim)}
  details{margin-top:10px}
  summary{cursor:pointer;color:var(--cyan);font-size:13.5px}
  .scroll{overflow-x:auto}
  table.pos{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px;min-width:420px}
  table.pos th,table.pos td{padding:4px 6px;border-bottom:1px solid #191d22;text-align:right;white-space:nowrap}
  table.pos th:first-child,table.pos td:first-child{text-align:left}
  table.pos th{color:var(--dim);font-weight:500}
  .foot{color:var(--dim);font-size:12px;margin-top:10px}
  #msg{padding:14px;color:var(--warn);font-size:14px}
</style>
</head>
<body>
<header>
  <h1>EA <span>Monitor</span></h1>
  <div id="meta">Memuat...</div>
</header>
<main>
  <div id="msg" hidden></div>
  <div class="totals" id="totals"></div>
  <div class="grid" id="grid"></div>
</main>

<script>
// Kosongkan untuk dideteksi otomatis dari alamat USERNAME.github.io/REPO/
var CFG = { user: "", repo: "", branch: "data", refreshSec: 120, staleMin: 15 };

function target(){
  var q = new URLSearchParams(location.search);
  var u = q.get("user") || CFG.user, r = q.get("repo") || CFG.repo;
  var host = location.hostname;
  if(!u && /\.github\.io$/i.test(host)) u = host.split(".")[0];
  if(!r){
    var seg = location.pathname.split("/").filter(Boolean);
    r = (seg.length && !/\.html?$/i.test(seg[0])) ? seg[0] : host;
  }
  return { u: u, r: r, b: q.get("branch") || CFG.branch };
}

function el(tag, cls, text){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text !== undefined && text !== null) e.textContent = text;
  return e;
}
function num(x, d){
  var v = Number(x);
  if(!isFinite(v)) return "-";
  d = (d === undefined) ? 2 : d;
  return v.toLocaleString("id-ID", { minimumFractionDigits: d, maximumFractionDigits: d });
}
function sign(x){ var v = Number(x); return v > 0 ? "up" : (v < 0 ? "down" : ""); }
function ago(sec){
  if(!isFinite(sec) || sec < 0) sec = 0;
  if(sec < 90) return Math.round(sec) + " detik lalu";
  if(sec < 5400) return Math.round(sec / 60) + " menit lalu";
  if(sec < 172800) return Math.round(sec / 3600) + " jam lalu";
  return Math.round(sec / 86400) + " hari lalu";
}
function dateStr(unix){
  if(!unix) return "-";
  return new Date(unix * 1000).toLocaleString("id-ID", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
}
function store(key, val){
  try{
    if(val === undefined) return JSON.parse(localStorage.getItem(key) || "null");
    localStorage.setItem(key, JSON.stringify(val));
  }catch(e){}
  return null;
}

async function listFiles(t){
  var key = "mjmon:" + t.u + "/" + t.r;
  try{
    var res = await fetch("https://api.github.com/repos/" + t.u + "/" + t.r + "/contents?ref=" + encodeURIComponent(t.b),
                          { headers: { "Accept": "application/vnd.github+json" } });
    if(!res.ok) throw new Error("HTTP " + res.status);
    var arr = await res.json();
    var names = arr.filter(function(f){ return f.type === "file" && /\.json$/i.test(f.name); })
                   .map(function(f){ return f.name; });
    store(key, names);
    return { names: names, note: "" };
  }catch(e){
    var cached = store(key);
    if(cached && cached.length) return { names: cached, note: "Daftar akun dari cache (" + e.message + ")" };
    throw e;
  }
}
async function getOne(t, name){
  try{
    var url = "https://raw.githubusercontent.com/" + t.u + "/" + t.r + "/" + t.b + "/" + encodeURIComponent(name) + "?t=" + Date.now();
    var res = await fetch(url, { cache: "no-store" });
    if(!res.ok) return null;
    return await res.json();
  }catch(e){ return null; }
}

function kvRow(tb, k, v, cls){
  var tr = el("tr");
  tr.appendChild(el("td", "dim", k));
  tr.appendChild(el("td", cls || "", v));
  tb.appendChild(tr);
}

function card(a, nowSec){
  var age = nowSec - Number(a.updated || 0);
  var stale = age > CFG.staleMin * 60;
  var cur = a.currency || "";
  var c = el("div", "card" + (stale ? " stale" : ""));

  var top = el("div", "top");
  var left = el("div");
  left.appendChild(el("div", "name", a.label || a.id || "akun"));
  var sub = [a.broker, a.server].filter(Boolean).join(" · ");
  if(a.login) sub += " · #" + a.login;
  left.appendChild(el("div", "sub", sub));
  top.appendChild(left);
  top.appendChild(el("span", "badge", (a.platform || "MT") + (cur ? " · " + cur : "")));
  c.appendChild(top);

  var eas = el("div", "eas");
  eas.appendChild(el("span", "dim", "EA: "));
  eas.appendChild(el("b", "", (a.eas && a.eas.length) ? a.eas.join(", ") : "-"));
  c.appendChild(eas);

  var big = el("div", "big");
  [["Balance", a.balance, ""], ["Equity", a.equity, ""], ["Floating", a.floating, sign(a.floating)]].forEach(function(x){
    var d = el("div");
    d.appendChild(el("div", "k", x[0]));
    d.appendChild(el("div", "v " + x[2], num(x[1])));
    big.appendChild(d);
  });
  c.appendChild(big);

  var tb = el("table", "kv");
  var pf = (a.profit_factor === null || a.profit_factor === undefined) ? "-" : num(a.profit_factor);
  var wr = a.trades > 0 ? " · menang " + num(a.wins / a.trades * 100, 0) + "%" : "";
  kvRow(tb, "Profit factor", pf, (a.profit_factor >= 1) ? "up" : (a.profit_factor !== null && a.profit_factor !== undefined ? "down" : ""));
  kvRow(tb, "Trade tertutup", (a.trades || 0) + wr);
  kvRow(tb, "Profit bersih", num(a.net_profit), sign(a.net_profit));
  kvRow(tb, "DD maks (balance)", num(a.dd_bal) + "  (" + num(a.dd_bal_pct, 1) + "%)", Number(a.dd_bal) > 0 ? "down" : "");
  kvRow(tb, "DD maks (equity)", num(a.dd_eq) + "  (" + num(a.dd_eq_pct, 1) + "%)", Number(a.dd_eq) > 0 ? "down" : "");
  kvRow(tb, "Depo", num(a.deposit));
  kvRow(tb, "WD", num(a.withdraw));
  if(Number(a.credit) !== 0 || Number(a.credit_now) !== 0) kvRow(tb, "Credit/bonus", num(a.credit_now));
  var ml = Number(a.margin) > 0 ? num(a.margin_level, 0) + "%" : "-";
  kvRow(tb, "Margin level", ml);
  c.appendChild(tb);

  var pos = a.positions || [];
  var det = el("details");
  det.appendChild(el("summary", "", "Posisi terbuka: " + pos.length + (a.pending ? "  ·  pending: " + a.pending : "")));
  if(pos.length){
    var wrap = el("div", "scroll");
    var t = el("table", "pos");
    var hr = el("tr");
    ["Simbol", "Tipe", "Lot", "Harga", "P/L", "Magic", "Komentar"].forEach(function(h){ hr.appendChild(el("th", "", h)); });
    t.appendChild(hr);
    pos.forEach(function(p){
      var tr = el("tr");
      tr.appendChild(el("td", "", p.s));
      tr.appendChild(el("td", p.t === "buy" ? "up" : "down", String(p.t || "").toUpperCase()));
      tr.appendChild(el("td", "", num(p.v)));
      tr.appendChild(el("td", "", String(p.p)));
      tr.appendChild(el("td", sign(p.pl), num(p.pl)));
      tr.appendChild(el("td", "dim", String(p.m)));
      tr.appendChild(el("td", "dim", p.c || ""));
      t.appendChild(tr);
    });
    wrap.appendChild(t);
    det.appendChild(wrap);
  }
  c.appendChild(det);

  var foot = el("div", "foot");
  foot.appendChild(el("span", stale ? "warn" : "", (stale ? "TIDAK ADA KABAR · " : "Update ") + ago(age)));
  foot.appendChild(el("span", "", "  ·  hitungan sejak " + dateStr(a.since)));
  c.appendChild(foot);
  return c;
}

function totals(list){
  var by = {};
  list.forEach(function(a){
    var k = a.currency || "?";
    if(!by[k]) by[k] = { n: 0, bal: 0, eq: 0, fl: 0 };
    by[k].n++; by[k].bal += Number(a.balance) || 0; by[k].eq += Number(a.equity) || 0; by[k].fl += Number(a.floating) || 0;
  });
  var box = document.getElementById("totals");
  box.textContent = "";
  Object.keys(by).sort().forEach(function(k){
    var d = el("div", "tot");
    d.appendChild(el("h3", "", "Total " + k + " · " + by[k].n + " akun"));
    var tb = el("table", "kv");
    kvRow(tb, "Balance", num(by[k].bal));
    kvRow(tb, "Equity", num(by[k].eq));
    kvRow(tb, "Floating", num(by[k].fl), sign(by[k].fl));
    d.appendChild(tb);
    box.appendChild(d);
  });
}

async function load(){
  var t = target();
  var msg = document.getElementById("msg"), meta = document.getElementById("meta");
  if(!t.u || !t.r){
    msg.hidden = false;
    msg.textContent = "Username/repository belum diketahui. Buka lewat alamat USERNAME.github.io/REPO/ atau tambahkan ?user=USERNAME&repo=REPO di alamat.";
    return;
  }
  try{
    var lf = await listFiles(t);
    var data = (await Promise.all(lf.names.map(function(n){ return getOne(t, n); }))).filter(Boolean);
    data.sort(function(a, b){ return String(a.label || "").localeCompare(String(b.label || "")); });
    var nowSec = Date.now() / 1000;
    var grid = document.getElementById("grid");
    grid.textContent = "";
    data.forEach(function(a){ grid.appendChild(card(a, nowSec)); });
    totals(data);
    msg.hidden = data.length > 0 && !lf.note;
    msg.textContent = data.length ? lf.note : "Belum ada data. Pasang MJ_MONITOR di terminal dan tunggu kiriman pertama.";
    meta.textContent = data.length + " akun · dimuat " + new Date().toLocaleTimeString("id-ID") +
                       " · muat ulang tiap " + CFG.refreshSec + " detik · " + t.u + "/" + t.r;
  }catch(e){
    msg.hidden = false;
    msg.textContent = "Gagal memuat daftar akun (" + e.message + "). Cek nama repository dan branch '" + t.b + "'.";
    meta.textContent = "Gagal memuat";
  }
}
load();
setInterval(load, CFG.refreshSec * 1000);
</script>
</body>
</html>
